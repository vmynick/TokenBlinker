; Claude token LED — USB-s változat (ESP32-C3 SuperMini Plus, WS2812B a GPIO8-on)
; A WiFi-s változat a token_led.ino (Arduino IDE), ezt a PlatformIO nem fordítja.

[env:supermini]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit NeoPixel
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
