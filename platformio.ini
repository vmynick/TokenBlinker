; Claude token LED - ESP32-C3 SuperMini Plus (onboard WS2812B on GPIO8)
; The old WiFi-only version is token_led.ino (Arduino IDE); PlatformIO does not build it.

[env:supermini]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel
    knolleary/PubSubClient
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
